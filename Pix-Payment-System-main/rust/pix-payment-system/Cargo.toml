[package]
name = "pix-payment-system"
version = "0.2.0"
edition = "2021"
description = "Payment system (PIX + African mobile money/rails) — Rust variant."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
